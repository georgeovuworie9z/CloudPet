name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cloudpet
          POSTGRES_PASSWORD: cloudpet
          POSTGRES_DB: cloudpet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudpet -d cloudpet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://cloudpet:cloudpet@localhost:5432/cloudpet_test
      JWT_SECRET_KEY: insecure-ci-only-jwt-secret-do-not-use-in-prod-0123456789
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.8"
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app tests

      - name: pytest
        run: uv run pytest
